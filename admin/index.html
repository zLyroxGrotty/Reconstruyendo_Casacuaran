<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestión de Contenidos | Reconstruyendo Casacuarán</title>
  <link rel="icon" type="image/svg+xml" href="../assets/logo-mark.svg">
  <style>
    /* Barra superior discreta para volver al portal público desde móvil o PC */
    .cms-return-bar {
      background-color: #121211;
      color: #F4F3EF;
      padding: 8px 16px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .cms-return-bar a {
      color: #FFFFFF;
      text-decoration: none;
      font-weight: 600;
    }
    .cms-return-bar a:hover {
      text-decoration: underline;
    }
    .cms-return-hint {
      color: rgba(244, 243, 239, 0.72);
      font-size: 11px;
      text-transform: none;
      letter-spacing: 0.01em;
    }

    /* Adaptación responsiva de Decap CMS para teléfonos móviles */
    @media (max-width: 820px) {
      html, body {
        overflow-x: hidden !important;
        max-width: 100vw !important;
      }
      #nc-root header > div {
        flex-wrap: wrap !important;
        height: auto !important;
        min-height: 52px !important;
        padding: 8px 12px !important;
        gap: 8px !important;
      }
      #nc-root aside {
        position: static !important;
        width: 100% !important;
        max-width: 100% !important;
        height: auto !important;
        margin-bottom: 12px !important;
      }
      #nc-root main,
      #nc-root [class*="AppMainContainer"],
      #nc-root [class*="CollectionMain"],
      #nc-root [class*="EditorContainer"],
      #nc-root [class*="ControlPaneContainer"] {
        padding-left: 10px !important;
        padding-right: 10px !important;
        margin-left: 0 !important;
        width: 100% !important;
        max-width: 100vw !important;
        min-width: 0 !important;
        box-sizing: border-box !important;
      }
      #nc-root [class*="ToolbarContainer"] {
        flex-wrap: wrap !important;
        height: auto !important;
        min-width: 0 !important;
        padding: 8px 10px !important;
        gap: 6px !important;
      }
      #nc-root [class*="Card"] {
        width: 100% !important;
        max-width: 100% !important;
        min-width: 0 !important;
        box-sizing: border-box !important;
      }
      /* Modal selector de archivos (Subir foto/video desde galería del celular) */
      [role="dialog"],
      div[class*="StyledModal"] {
        width: calc(100vw - 16px) !important;
        max-width: calc(100vw - 16px) !important;
        min-width: 0 !important;
        height: 88vh !important;
        max-height: 88vh !important;
        padding: 12px !important;
        box-sizing: border-box !important;
      }
      div[class*="LibraryTop"] {
        flex-wrap: wrap !important;
        gap: 8px !important;
      }
    }
  </style>
  <!-- Netlify Identity para acceso e invitación por correo -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <div class="cms-return-bar">
    <a href="../index.html">&larr; Volver al portal Casacuarán</a>
    <span class="cms-return-hint">Panel en línea con subida de fotos y videos</span>
  </div>
  <!-- Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
